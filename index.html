<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FastenFinance</title>
<!-- Árfolyamok + Fear & Greed — minimál oldal -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body{margin:0;background:#0f172a;color:#e5e7eb;font:16px system-ui;padding:24px}
    h1{font-size:22px;margin:0 0 16px}
    button{padding:8px 14px;border-radius:8px;border:1px solid #334155;background:#1f2937;color:#e5e7eb;cursor:pointer}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .card{background:#111827;border-radius:12px;padding:16px}
    .label{color:#9ca3af;font-size:13px}
    .value{font-weight:700;font-size:22px;margin-bottom:4px}
    .sub{color:#9ca3af;font-size:13px}
    canvas{width:100%;height:280px}
    footer{margin-top:28px;color:#9ca3af;font-size:14px}
    a{color:#93c5fd}
    .fg-badge{display:inline-block;border-radius:999px;padding:4px 10px;font-weight:600}
    .fgi-bar{width:100%;height:12px;background:#374151;border-radius:6px;overflow:hidden;margin-top:8px}
    .fgi-fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);}
  </style>
</head>
<body>
  <h1>Árfolyamok + CNN Fear & Greed Index</h1>
  <button id="refreshBtn">Frissítés</button>

  <section class="grid" style="margin-top:16px">
    <div class="card">
      <div class="label">USD → HUF</div>
      <div id="usdHufNow" class="value">—</div>
      <div id="usdHufNowTime" class="label"></div>
    </div>
    <div class="card">
      <div class="label">EUR → HUF</div>
      <div id="eurHufNow" class="value">—</div>
      <div id="eurHufNowTime" class="label"></div>
    </div>
    <div class="card">
      <div class="label">CNN Fear & Greed Index</div>
      <div id="fgiNow" class="value">—</div>
      <div id="fgiRating" class="fg-badge">—</div>
      <div id="fgiDetails" class="label"></div>
      <div class="fgi-bar"><div id="fgiFill" class="fgi-fill" style="width:0%"></div></div>
    </div>
    <div class="card">
      <div class="label">EU tőzsde (Xetra)</div>
      <div id="euMarket" class="value">—</div>
      <div id="euNext" class="sub"></div>
    </div>
    <div class="card">
      <div class="label">USA tőzsde (NYSE/NASDAQ)</div>
      <div id="usMarket" class="value">—</div>
      <div id="usNext" class="sub"></div>
    </div>
  </section>

  <section class="grid" style="margin-top:16px">
    <div class="card">
      <div class="label">~7 nap USD/HUF</div>
      <canvas id="usdHufChart"></canvas>
    </div>
    <div class="card">
      <div class="label">~7 nap EUR/HUF</div>
      <canvas id="eurHufChart"></canvas>
    </div>
    <div class="card">
      <div class="label">Fear & Greed történet (7 nap)</div>
      <canvas id="fgiChart"></canvas>
    </div>
  </section>

  <footer>
    <div>Források: <a href="https://www.frankfurter.app/">Frankfurter API</a>, <a href="https://edition.cnn.com/markets/fear-and-greed">CNN</a>.</div>
  </footer>

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => new Intl.NumberFormat('hu-HU', {maximumFractionDigits: 2}).format(n);

  let charts = { usd:null, eur:null, fgi:null };

  async function fetchFxLatest(from, to){
    const res = await fetch(`https://api.frankfurter.app/latest?from=${from}&to=${to}`);
    return res.json();
  }
  async function fetchFxSeries(from, to, days=7){
    const end = new Date();
    const start = new Date(); start.setDate(end.getDate()-days-1);
    const res = await fetch(`https://api.frankfurter.app/${start.toISOString().slice(0,10)}..${end.toISOString().slice(0,10)}?from=${from}&to=${to}`);
    return res.json();
  }

  async function fetchStockFearGreed(){
    const today = new Date().toISOString().slice(0,10);
    const res = await fetch(`https://production.dataviz.cnn.io/index/fearandgreed/graphdata/${today}`);
    return res.json();
  }

  function renderChart(canvasId, labels, data, label){
    if(charts[canvasId]) charts[canvasId].destroy();
    charts[canvasId] = new Chart($(canvasId),{
      type:'line',
      data:{labels,datasets:[{label,data,fill:false,borderColor:'#3b82f6',tension:0.25}]},
      options:{plugins:{legend:{display:false}}}
    });
  }

  function marketStatus(timeZone, openHour, openMinute, closeHour, closeMinute, labelId, nextId) {
    const now = new Date();
    const tzNow = new Date(now.toLocaleString('en-US', { timeZone }));
    const day = tzNow.getDay(); // 0=vasárnap, 6=szombat

    const open = new Date(tzNow);
    open.setHours(openHour, openMinute, 0, 0);
    const close = new Date(tzNow);
    close.setHours(closeHour, closeMinute, 0, 0);

    let openNow = tzNow >= open && tzNow < close && day >=1 && day <=5;
    if(openNow){
      $(labelId).textContent = 'NYITVA';
      $(nextId).textContent = '';
    } else {
      $(labelId).textContent = 'ZÁRVA';
      // Következő nyitás számítása magyar idő szerint
      let nextOpen = new Date(open);
      if(tzNow >= close) nextOpen.setDate(nextOpen.getDate()+1);
      while(nextOpen.getDay()===0 || nextOpen.getDay()===6){
        nextOpen.setDate(nextOpen.getDate()+1);
      }
      const nextOpenHu = new Date(nextOpen.toLocaleString('en-US', { timeZone: 'Europe/Budapest' }));
      const diffMs = nextOpenHu - now;
      const diffHrs = Math.round(diffMs/36e5);
      const timeStr = nextOpenHu.toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'});
      const dateStr = nextOpenHu.toLocaleDateString('hu-HU',{month:'2-digit',day:'2-digit'});
      $(nextId).textContent = `Következő nyitás: ${dateStr} ${timeStr} (≈${diffHrs} óra múlva)`;
    }
  }

  async function refreshAll(){
    $('refreshBtn').disabled=true; $('refreshBtn').innerText='Frissítés…';
    try{
      const [usdNow, eurNow, usdSeries, eurSeries, fgi] = await Promise.all([
        fetchFxLatest('USD','HUF'),
        fetchFxLatest('EUR','HUF'),
        fetchFxSeries('USD','HUF'),
        fetchFxSeries('EUR','HUF'),
        fetchStockFearGreed()
      ]);
      // FX now
      $('usdHufNow').textContent = fmt(usdNow.rates.HUF);
      $('usdHufNowTime').textContent = `Forrás dátum: ${usdNow.date}`;
      $('eurHufNow').textContent = fmt(eurNow.rates.HUF);
      $('eurHufNowTime').textContent = `Forrás dátum: ${eurNow.date}`;
      // FX chart
      const usdDates = Object.keys(usdSeries.rates).sort();
      const usdVals = usdDates.map(d=>usdSeries.rates[d].HUF);
      renderChart('usdHufChart', usdDates, usdVals, 'USD/HUF');
      const eurDates = Object.keys(eurSeries.rates).sort();
      const eurVals = eurDates.map(d=>eurSeries.rates[d].HUF);
      renderChart('eurHufChart', eurDates, eurVals, 'EUR/HUF');
      // FGI
      const fgiNow = fgi.fear_and_greed;
      $('fgiNow').textContent = fgiNow.score;
      $('fgiRating').textContent = fgiNow.rating;
      $('fgiDetails').textContent = `Előző záró: ${fgiNow.previous_close.toFixed(1)}, 1 hét: ${fgiNow.previous_1_week.toFixed(1)}, 1 hónap: ${fgiNow.previous_1_month.toFixed(1)}`;
      $('fgiFill').style.width = `${fgiNow.score}%`;
      // FGI chart
      const hist = fgi.fear_and_greed_historical.data || [];
      const labels = hist.map(d=> new Date(d.x).toISOString().slice(5,10));
      const vals = hist.map(d=>d.y);
      renderChart('fgiChart', labels, vals, 'CNN FGI');
      // Market open + next
      marketStatus('Europe/Berlin', 9,0,17,30,'euMarket','euNext');
      marketStatus('America/New_York', 9,30,16,0,'usMarket','usNext');
    }catch(e){alert('Hiba történt: '+e)}
    $('refreshBtn').disabled=false; $('refreshBtn').innerText='Frissítés';
  }

  $('refreshBtn').addEventListener('click', refreshAll);
  refreshAll();
</script>
</body>
</html>
